services:
  mongo:
    image: mongo:8
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/zap-runner
      PORT: '3000'
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

  smee:
    image: node:24-alpine
    command:
      - npx
      - --yes
      - smee-client@5.0.0
      - --url
      - ${WEBHOOK_PUBLIC_URL:?Set WEBHOOK_PUBLIC_URL in .env}
      - --target
      - http://api:3000/webhooks/github
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
